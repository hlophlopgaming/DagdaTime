[package]
name = "draugr-time"
default-run = "draugr-time"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
draugr-time-daemon = { path = "../daemon" }
draugr-time-core.workspace = true
draugr-time-watchers.workspace = true
chrono = "0.4"
auto-launch = "0.6"
iced = { version = "0.14", default-features = false, features = ["advanced", "tiny-skia", "canvas", "tokio", "image-without-codecs", "svg", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"
gtk = "0.18"
shlex = "2"
zbus = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary"] }
