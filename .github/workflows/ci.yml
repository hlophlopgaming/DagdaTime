name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxkbcommon-x11-dev librsvg2-dev xvfb
      - run: python -m unittest discover -s tests
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Verify Linux StatusNotifierItem menu without a GUI
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test --package draugr-time native_ksni_menu_dispatches_without_gui_ticks -- --ignored --test-threads=1
      - name: Verify native X11 watcher and debug polling
        if: runner.os == 'Linux'
        run: env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 xvfb-run -a cargo test --package draugr-time-watchers --package draugr-time-daemon -- --ignored --test-threads=1
      - run: cargo build --package draugr-time --release
      - name: Launch desktop (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 xvfb-run -a target/release/draugr-time --smoke-test
          dbus-run-session -- env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 DRAUGR_TIME_DATA_DIR="$RUNNER_TEMP/draugr-time-runtime" xvfb-run -a target/release/draugr-time --runtime-test
          dbus-run-session -- env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 DRAUGR_TIME_DATA_DIR="$RUNNER_TEMP/draugr-time-lifecycle" xvfb-run -a target/release/draugr-time --lifecycle-test
          dbus-run-session -- env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 DRAUGR_TIME_DATA_DIR="$RUNNER_TEMP/draugr-time-onboarding" xvfb-run -a target/release/draugr-time --onboarding-test
          XDG_CONFIG_HOME="$RUNNER_TEMP/draugr-time-autostart" target/release/draugr-time --autostart-test
      - name: Launch desktop (macOS)
        if: runner.os == 'macOS'
        run: |
          target/release/draugr-time --smoke-test
          DRAUGR_TIME_DATA_DIR="$RUNNER_TEMP/draugr-time-runtime" target/release/draugr-time --runtime-test
          DRAUGR_TIME_DATA_DIR="$RUNNER_TEMP/draugr-time-lifecycle" target/release/draugr-time --lifecycle-test
          DRAUGR_TIME_DATA_DIR="$RUNNER_TEMP/draugr-time-onboarding" target/release/draugr-time --onboarding-test
          target/release/draugr-time --autostart-test
      - name: Launch desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($mode in @('--smoke-test','--runtime-test','--lifecycle-test','--onboarding-test','--autostart-test')) {
            $name = $mode.TrimStart('-')
            $env:DRAUGR_TIME_DATA_DIR = Join-Path $env:RUNNER_TEMP "draugr-time-$name"
            $process = Start-Process target/release/draugr-time.exe -ArgumentList $mode -PassThru -Wait
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          }
      - name: Assemble macOS application bundle
        if: runner.os == 'macOS'
        run: |
          python scripts/package_macos.py
          codesign --force --deep --sign - "target/release/Draugr Time.app"
          "target/release/Draugr Time.app/Contents/MacOS/draugr-time" --smoke-test
          tar -C target/release -czf target/release/Draugr-Time-macOS.tar.gz "Draugr Time.app" draugr-time
      - name: Upload desktop and CLI executables
        uses: actions/upload-artifact@v4
        with:
          name: Draugr-Time-${{ runner.os }}
          path: |
            target/release/draugr-time
            target/release/draugr-time.exe
            target/release/draugr-time-cli
            target/release/draugr-time-cli.exe
            target/release/Draugr-Time-macOS.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Draugr-Time-*
          path: artifacts
      - name: Package desktop binaries
        run: |
          mkdir -p release
          chmod +x artifacts/Draugr-Time-{Linux,macOS}/draugr-time artifacts/Draugr-Time-{Linux,macOS}/draugr-time-cli
          cp packaging/org.draugrtime.app.desktop artifacts/Draugr-Time-Linux/
          mkdir -p artifacts/Draugr-Time-Linux/icons/hicolor/128x128/apps
          cp logo/blackDraugr128.png artifacts/Draugr-Time-Linux/icons/hicolor/128x128/apps/org.draugrtime.app.png
          tar -C artifacts/Draugr-Time-Linux -czf release/Draugr-Time-${GITHUB_REF_NAME}-Linux-x86_64.tar.gz draugr-time org.draugrtime.app.desktop icons
          cp artifacts/Draugr-Time-macOS/Draugr-Time-macOS.tar.gz release/Draugr-Time-${GITHUB_REF_NAME}-macOS.tar.gz
          cd artifacts/Draugr-Time-Windows
          zip "../../release/Draugr-Time-${GITHUB_REF_NAME}-Windows-x86_64.zip" draugr-time.exe draugr-time-cli.exe
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "${{ github.repository }}" --title "Draugr Time $GITHUB_REF_NAME" --notes-file docs/releases/${GITHUB_REF_NAME}.md
